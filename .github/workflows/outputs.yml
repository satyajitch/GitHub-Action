name: Output demo
on: 
  push: 
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        id: stepone
        run: echo "version: 1.0.0" >> $GITHUB_OUTPUT

      - name: step2
        run: echo "The artifact version is ${{ step1.stepone.outputs.version }}"
